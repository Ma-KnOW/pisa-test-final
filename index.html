<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PISA SPARK - เลือกวิชา</title>
    <!-- นำเข้าฟอนต์น่ารักแนวเกม/การ์ตูน -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* ค่าเริ่มต้น: สำหรับหน้าจอคอมพิวเตอร์ (bg3.png) */
            background-image: url('bg3.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: 'Mali', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- แถบปุ่มควบคุมด้านบนขวา (เสียง + ภาษา) --- */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        /* สไตล์ปุ่มกลม 3D */
        .circle-btn {
            position: relative;
            overflow: hidden;
            width: 55px;
            height: 55px;
            background: #ffffff;
            border: 3.5px solid #222222;
            border-radius: 50%;
            box-shadow: 0 4px 0 #222222, 0 6px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
            user-select: none;
            color: #222222;
        }

        /* ปุ่มภาษา (สีทอง 3D) */
        .lang-btn {
            background: radial-gradient(circle at 35% 30%, #fff176 0%, #fbc02d 60%, #f57f17 100%);
            border-color: #5d3900;
            box-shadow: 0 4px 0 #5d3900, 0 6px 10px rgba(0, 0, 0, 0.2);
            color: #4a2800;
            font-size: 18px;
        }

        .circle-btn:hover {
            transform: scale(1.08) translateY(-2px);
        }

        .circle-btn:active {
            transform: translateY(3px) scale(0.95) !important;
            box-shadow: 0 1px 0 #222222 !important;
        }

        .lang-btn:active {
            box-shadow: 0 1px 0 #5d3900 !important;
        }

        /* --- คอนเทนเนอร์ปุ่มหมวดวิชา --- */
        .category-container {
            position: absolute;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 20;
            width: 90%;
            max-width: 900px;
            flex-wrap: wrap;
        }

        /* สไตล์ปุ่มกดแนวการ์ตูน 3 มิติ */
        .subject-btn {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            padding: 14px 26px;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            border: 4px solid #ffffff;
            border-radius: 50px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            flex: 1;
            min-width: 220px;
            max-width: 270px;
        }

        /* 1. ปุ่มวิทยาศาสตร์ */
        .btn-science {
            background: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
            box-shadow: 0 8px 0 #0a6950, 0 12px 16px rgba(0, 0, 0, 0.35);
        }

        /* 2. ปุ่มคณิตศาสตร์ */
        .btn-math {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 8px 0 #1c5982, 0 12px 16px rgba(0, 0, 0, 0.35);
        }

        /* 3. ปุ่มการอ่าน */
        .btn-reading {
            background: linear-gradient(180deg, #ff7675 0%, #d63031 100%);
            box-shadow: 0 8px 0 #8b1d1e, 0 12px 16px rgba(0, 0, 0, 0.35);
        }

        .subject-btn:hover {
            transform: translateY(-4px) scale(1.04);
        }

        /* เอฟเฟกต์ตอนกดปุ่มวิชา: ยุบตัวและลดเงาจำลองแรงกดจริง */
        .subject-btn:active {
            transform: translateY(6px) scale(0.97) !important;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.6), 0 4px 6px rgba(0, 0, 0, 0.2) !important;
        }

        /* เอฟเฟกต์แสงคลื่นกระจาย (Ripple Wave) */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: rippleEffect 0.5s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        /* ============================================================
            📱 กฎสำหรับหน้าจอมือถือ (หน้าจอแคบกว่า 768px)
        ============================================================ */
        @media screen and (max-width: 768px) {
            body {
                background-image: url('bg-mobile.png');
                background-position: center center;
            }

            .top-controls {
                top: 15px;
                right: 15px;
                gap: 8px;
            }

            .circle-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .lang-btn {
                font-size: 14px;
            }

            .category-container {
                bottom: 5vh;
                width: 88%;
                gap: 8px;
            }

            .subject-btn {
                padding: 10px 14px;
                font-size: 16px;
                min-width: 100%;
                border-width: 3px;
                box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
            }

            .icon {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- แถบปุ่มควบคุมด้านบนขวา -->
    <div class="top-controls">
        <button id="langToggle" class="circle-btn lang-btn interactive-btn" title="เปลี่ยนภาษา / Switch Language">TH</button>
        <button id="musicToggle" class="circle-btn interactive-btn" title="เปิด/ปิดเสียง">🔊</button>
    </div>

    <!-- ไฟล์เสียงพื้นหลัง -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- ปุ่มเลือกวิชา -->
    <div class="category-container">
        <a href="science.html" class="subject-btn btn-science interactive-btn">
            <span class="icon">🧪</span>
            <span id="txtScience">วิทยาศาสตร์</span>
        </a>

        <a href="math.html" class="subject-btn btn-math interactive-btn">
            <span class="icon">📐</span>
            <span id="txtMath">คณิตศาสตร์</span>
        </a>

        <a href="read.html" class="subject-btn btn-reading interactive-btn">
            <span class="icon">📖</span>
            <span id="txtReading">การอ่าน</span>
        </a>
    </div>

    <script>
        // ==========================================
        // 🔊 ระบบเสียงเอฟเฟกต์ตอนกดปุ่ม (Web Audio API Synthesizer)
        // (สร้างเสียงป๊อปดึ๋งสดใสโดยไม่ต้องโหลดไฟล์เสียงเพิ่ม)
        // ==========================================
        let audioCtx;
        function playClickSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                // เสียง Pop/Bubble โทนแหลมแบบเกมน่ารัก
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.09);
            } catch (e) {
                // ข้ามถ้าเบราว์เซอร์ไม่รองรับ
            }
        }

        // ==========================================
        // ✨ สร้างเอฟเฟกต์ Ripple แสงกระจาย + เสียงคลิก
        // ==========================================
        document.querySelectorAll('.interactive-btn').forEach(button => {
            button.addEventListener('pointerdown', function (e) {
                // เล่นเสียงกดปุ่ม
                playClickSound();

                // สร้างวงแหวนแสง Ripple
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;
                const rect = button.getBoundingClientRect();

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = button.getElementsByClassName('ripple')[0];
                if (ripple) {
                    ripple.remove();
                }
                button.appendChild(circle);
            });
        });

        // ==========================================
        // 🎵 ระบบควบคุมเพลงพื้นหลัง
        // ==========================================
        const audio = document.getElementById('bgMusic');
        const toggleBtn = document.getElementById('musicToggle');
        
        let isPlaying = false;
        let isUserMuted = false;

        function playAudio() {
            if (isUserMuted) return;

            audio.play().then(() => {
                isPlaying = true;
                toggleBtn.textContent = '🔊';
                removeUnlockListeners();
            }).catch(() => {
                isPlaying = false;
                toggleBtn.textContent = '🔇';
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            toggleBtn.textContent = '🔇';
        }

        function unlockAudio(e) {
            if (e.target.closest('#musicToggle')) return;
            if (!isPlaying && !isUserMuted) {
                playAudio();
            }
        }

        function removeUnlockListeners() {
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
        }

        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        window.addEventListener('DOMContentLoaded', () => {
            playAudio();
        });

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            if (isPlaying) {
                isUserMuted = true;
                removeUnlockListeners();
                pauseAudio();
            } else {
                isUserMuted = false;
                playAudio();
            }
        });

        // ==========================================
        // 🌐 ระบบสลับภาษา
        // ==========================================
        const langBtn = document.getElementById('langToggle');
        const txtScience = document.getElementById('txtScience');
        const txtMath = document.getElementById('txtMath');
        const txtReading = document.getElementById('txtReading');
        
        let currentLang = 'th';

        const translations = {
            th: {
                science: "วิทยาศาสตร์",
                math: "คณิตศาสตร์",
                reading: "การอ่าน",
                btnText: "TH"
            },
            en: {
                science: "Science",
                math: "Mathematics",
                reading: "Reading",
                btnText: "EN"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            
            txtScience.textContent = translations[currentLang].science;
            txtMath.textContent = translations[currentLang].math;
            txtReading.textContent = translations[currentLang].reading;
            langBtn.textContent = translations[currentLang].btnText;
        }

        langBtn.addEventListener('click', toggleLanguage);
    </script>
</body>
</html>
